name: "Bot CI"

on:
  push:
    branches:
      - "develop"
      - "trunk"
    paths: &filelist
      - ".github/workflows/ci.yaml"
      - "chunithm_net/**"
      - "assets/**"
      - "cogs/**"
      - "database/**"
      - "dbutils/**"
      - "tests/**"
      - "utils/**"
      - "bot.py"
      - "pyproject.toml"
      - "uv.lock"
      - "web.py"
  pull_request:
    branches:
      - "develop"
    paths: *filelist
  workflow_dispatch:

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8" # v5

      - name: "Install uv"
        uses: "astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4" # v6

      - name: "Install dependencies"
        run: "uv sync --group test --frozen"

      - name: "Run tests"
        run: "uv run pytest -v --html=report.html --self-contained-html tests"

      - name: "Upload test report"
        if: "always()"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4
        with:
          name: "test-report"
          path: "report.html"
          if-no-files-found: "error"
  build:
    runs-on: "ubuntu-latest"
    needs: ["test"]
    if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
    permissions:
      packages: "write"
      contents: "read"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8" # v5

      - name: "(unfortunately) closed source components"
        run: |
          curl -L "$CR_COG_LINK" -o "$CR_COG_PATH"
          echo "COG_LIST += ['$CR_COG_NAME']" >> cogs/__init__.py
        env:
          CR_COG_LINK: "${{ secrets.CR_COG_LINK }}"
          CR_COG_PATH: "${{ secrets.CR_COG_PATH }}"
          CR_COG_NAME: "${{ secrets.CR_COG_NAME }}"

      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392" # v3

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435" # v3

      - name: "Log in to Docker Hub"
        uses: "docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1" # v3
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Extract metadata (tags, labels) for Docker"
        id: "meta"
        uses: "docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f" # v5
        with:
          images: "ghcr.io/beer-psi/chuni-penguin"

      - name: "Build and push"
        uses: "docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83" # v6
        with:
          build-args: |
            GIT_SHA=${{ github.sha }}
            UID=${{ vars.UID }}
            GID=${{ vars.GID }}
          context: "."
          push: "${{ github.event_name != 'pull_request' }}"
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"
  deploy:
    runs-on: "ubuntu-latest"
    needs: ["test", "build"]
    if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
    steps:
      - name: "Tailscale"
        uses: "tailscale/github-action@84a3f23bb4d843bcf4da6cf824ec1be473daf4de" # v3
        with:
          oauth-client-id: "${{ secrets.TS_OAUTH_CLIENT_ID }}"
          oauth-secret: "${{ secrets.TS_OAUTH_SECRET }}"
          tags: "tag:ci"
          use-cache: "true"

      - name: "Setup SSH"
        uses: "webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd" # v0.9
        with:
          ssh-private-key: "${{ secrets.SSH_PRIVATE_KEY }}"

      - name: "Deploy staging"
        if: "github.ref == 'refs/heads/develop'"
        run: 'ssh beerpsi@"$SSH_HOST" /mnt/sdb1/chuni-penguin-develop/deploy.sh'
        env:
          SSH_HOST: "${{ secrets.SSH_HOST }}"

      - name: "Deploy production"
        if: "github.ref == 'refs/heads/trunk'"
        run: 'ssh beerpsi@"$SSH_HOST" /mnt/sdb1/chuninewbot/deploy.sh'
        env:
          SSH_HOST: "${{ secrets.SSH_HOST }}"
