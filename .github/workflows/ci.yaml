name: "Bot CI"

on:
  push:
    branches:
      - "develop"
      - "trunk"
    paths: &filelist
      - ".github/workflows/ci.yaml"
      - "chuni_penguin/**"
      - "!chuni_penguin/database/seeds/**"
      - "dbutils/**"
      - "packages/**"
      - "patches/**"
      - "tests/**"
      - "launcher.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
  pull_request:
    branches:
      - "develop"
    paths: *filelist
  workflow_dispatch:

concurrency:
  group: "deploy-${{ github.ref }}-${{ github.sha }}"
  cancel-in-progress: false

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6

      - name: "Install uv"
        uses: "astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78" # v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: "Install dependencies"
        run: "uv sync --frozen --all-extras"

      - name: "Linting"
        run: "uv run ruff check"
        env:
          RUFF_OUTPUT_FORMAT: "github"

      - name: "Type checking"
        run: "uv run basedpyright"

      - name: "Run tests"
        run: |
          cp bot.example.ini bot.ini
          uv run pytest -v --html=report.html --self-contained-html tests

      - name: "Upload test report"
        if: "always()"
        uses: "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f" # v6
        with:
          name: "test-report"
          path: "report.html"
          if-no-files-found: "error"

  build:
    runs-on: "ubuntu-latest"
    needs: ["test"]
    permissions:
      packages: "write"
      contents: "read"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6

      - name: "Commit hash"
        run: 'echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV'

      - name: "(unfortunately) closed source components"
        run: |
          curl -L "$CR_COG_LINK" -o "chuni_penguin/$CR_COG_PATH"
          echo "COG_LIST += ['chuni_penguin.$CR_COG_NAME']" >> chuni_penguin/cogs/__init__.py
        env:
          CR_COG_LINK: "${{ secrets.CR_COG_LINK }}"
          CR_COG_PATH: "${{ secrets.CR_COG_PATH }}"
          CR_COG_NAME: "${{ secrets.CR_COG_NAME }}"

      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130" # v3

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f" # v3

      - name: "Log in to Docker Hub"
        uses: "docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9" # v3
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Extract metadata (tags, labels) for Docker"
        id: "meta"
        uses: "docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051" # v5
        with:
          images: "ghcr.io/beer-psi/chuni-penguin"

      - name: "Build and push"
        uses: "docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8" # v6
        with:
          build-args: |
            GIT_SHA=${{ env.SHORT_SHA }}
            UID=${{ vars.UID }}
            GID=${{ vars.GID }}
          context: "."
          push: "${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}"
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"

  deploy:
    runs-on: "ubuntu-latest"
    needs: ["test", "build"]
    if: "github.event_name == 'push' || github.event_name == 'workflow_dispatch'"
    steps:
      - name: "Tailscale"
        uses: "tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8" # v4
        with:
          oauth-client-id: "${{ secrets.TS_OAUTH_CLIENT_ID }}"
          oauth-secret: "${{ secrets.TS_OAUTH_SECRET }}"
          tags: "tag:ci"
          use-cache: "true"
          ping: "${{ secrets.SSH_HOST }}"

      - name: "Setup SSH"
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: "${{ secrets.SSH_PRIVATE_KEY }}"
          SSH_KNOWN_HOSTS: "${{ secrets.SSH_KNOWN_HOSTS }}"

      - name: "Deploy staging"
        if: "github.ref == 'refs/heads/develop'"
        run: 'ssh beerpsi@"$SSH_HOST" /mnt/sda1/chuni-penguin-develop/deploy.sh'
        env:
          SSH_HOST: "${{ secrets.SSH_HOST_DEVELOP }}"

      - name: "Deploy production"
        if: "github.ref == 'refs/heads/trunk'"
        run: 'ssh chuni-penguin@"$SSH_HOST" /home/chuni-penguin/chuni-penguin/deploy.sh'
        env:
          SSH_HOST: "${{ secrets.SSH_HOST_PRODUCTION }}"
