name: "Test DB generation"

on:
  workflow_dispatch:
  schedule:
    - cron: "7 13 * * *"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-creating-db:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8" # v5

      - name: "Install uv"
        uses: "astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41" # v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: "Install dependencies"
        run: "uv sync --frozen"

      - name: Configuration
        run: |
          mkdir -p data/
          cp bot.example.ini bot.ini
          sed -i 's/# chunirec_token = <token>/chunirec_token = ${{ secrets.CHUNIREC_TOKEN }}/' bot.ini

      - name: Create database from schema
        run: "uv run python -m dbutils create"

      - name: Update database with information from Chunirec + Zetaraku + Official website
        run: "uv run python -m dbutils update chunirec"

      - name: Update sdvx.in chart views
        run: "uv run python -m dbutils update sdvxin"

      - name: Update database aliases
        run: "uv run python -m dbutils update alias"

      - name: Update song jacket lookup
        run: "uv run python -m dbutils update jackets"

      - name: Update Tachi-related information
        run: "uv run python -m dbutils update tachi"

      - name: Upload created database
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database
          path: data/database.sqlite3
