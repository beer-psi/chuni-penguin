	<script>
		var scrollPoint = $('.scroll_point').length;
		// 上へ
		$('#page-top').click(function () {
			if (scrollPoint > 0) {
				var fromPos = Math.floor($(window).scrollTop());
				var toPos   = 0;
				$(".scroll_point").each(function() {
					var targetPos = Math.floor($(this).offset().top);
					if (fromPos > targetPos) {
						toPos = targetPos;
					} else {
						return false;
					}
				});
				$('body,html').animate({scrollTop: toPos}, 500);
			} else {
				$('body,html').animate({scrollTop: 0}, 500);
			}
			return false;
		});
		// 下へ
		$('#page-bottom').click(function () {
			if (scrollPoint > 0) {
				var fromPos = Math.floor($(window).scrollTop());
				var toPos   = Math.floor($(document).height());
				$(".scroll_point").each(function() {
					var targetPos = Math.floor($(this).offset().top);
					if (fromPos < targetPos) {
						toPos = targetPos;
						return false;
					}
				});
				$('body,html').animate({scrollTop: toPos}, 500);
			} else {
				$('body,html').animate({scrollTop: $(document).height()}, 500);
			}
			return false;
		});
	</script>
	<script>
function pageMove(obj) {
	var form = $(obj).parent('form');
	if (form.length > 0) {
		form.submit();
		return true;
	} else {
		return false;
	}
}
$('div.btn_search').click(function(){
	var form = $(this).parents('form');
	if (form.length > 0) {
		form.submit();
		return true;
	} else {
		return false;
	}
});
$('div.btn_friend_apply').click(function(){
	var answer = window.confirm("Are you sure you want to apply?\n\nIf they approve,\n they will be your friend.");
	if (!answer) {
		return false;
	} else {
		var form = $(this).parent('form');
		if (form.length > 0) {
			form.submit();
			return true;
		} else {
			return false;
		}
	}
});
</script>
