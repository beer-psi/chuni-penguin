[project]
name = "chuni-penguin"
version = "2025.9"
description = "Add your description here"
authors = [{ name = "beerpsi", email = "beerpsi@duck.com" }]
dependencies = [
    "discord-py>=2.6.3",
    "beautifulsoup4>=4.12.3",
    "pillow>=11.0.0",
    "alembic>=1.13.3",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.2",
    "rapidfuzz>=3.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2024.2; sys_platform == 'win32'",
    "msgspec>=0.18.6",
    "structlog>=25.2.0",
    "async-lru>=2.0.5",
    "discord-ext-track-edits>=0.1.2",
    "hishel>=0.1.3",
    "platformdirs>=4.3.8",
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "discord-ext-songbird",
    "httpx-aiohttp",
]
readme = "README.md"
requires-python = ">= 3.12"

[project.optional-dependencies]
speedup = [
    "faust-cchardet>=2.1.19",
    "brotli>=1.1.0",
    "lxml>=5.3.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "winloop>=0.1.6; sys_platform == 'win32'",
    "zstandard>=0.23.0",
    "aiodns>=3.2.0; sys_platform != 'win32'",
    "ciso8601>=2.3.2",
    "penguin-native",
]

[dependency-groups]
dev = [
    "types-beautifulsoup4>=4.12.0.20240907",
    "jishaku>=2.5.2",
    "ruff==0.13.2",
    "basedpyright==1.31.6",
    { include-group = "test" },
]
test = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.32.0",
    "pytest-html>=4.1.1",
]

[tool.uv]
managed = true
package = false
no-sources = false
# index-url = "https://mirrors.sustech.edu.cn/pypi/web/simple"

[tool.uv.pip]
universal = true
generate-hashes = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
discord-ext-songbird = { git = "https://github.com/beer-psi/discord-ext-songbird.git" }
penguin-native = { workspace = true }
httpx-aiohttp = { workspace = true }

[tool.ruff]
respect-gitignore = true

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "EM",
    "F",
    "FBT",
    "FLY",
    "I",
    "ISC",
    "Q",
    "PERF",
    "PGH",
    "PIE",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "TRY",
    "TID252",
    "W",
]
ignore = ["E501"]
unfixable = ["B"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"bot.py" = ["E402"]
"chunithm_net/consts.py" = ["RUF001"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
