[project]
name = "chuni-penguin"
version = "2026.2"
description = "Add your description here"
authors = [{ name = "beerpsi", email = "beerpsi@duck.com" }]
dependencies = [
    "discord-py~=2.6",
    "beautifulsoup4~=4.14",
    "pillow~=12.0",
    "alembic~=1.17.2",
    "aiosqlite~=0.22.0",
    "httpx~=0.28.1",
    "rapidfuzz~=3.14",
    "sqlalchemy[asyncio]~=2.0.46",
    "tzdata>=2024.2; sys_platform == 'win32'",
    "msgspec~=0.20.0",
    "structlog~=25.5",
    "async-lru~=2.0",
    "discord-ext-track-edits~=0.1.2",
    "hishel==0.1.3",
    "platformdirs~=4.5",
    "audioop-lts~=0.2.2; python_version >= '3.13'",
    "discord-ext-songbird~=0.2.0a2",
    "httpx-aiohttp",
    "python-magic~=0.4.27",
]
readme = "README.md"
requires-python = ">= 3.13"

[project.optional-dependencies]
speedup = [
    "lxml~=6.0",
    "uvloop~=0.22.1; sys_platform != 'win32' and implementation_name == 'cpython'",
    "winloop~=0.4.1; sys_platform == 'win32' and implementation_name == 'cpython'",
    "zstandard~=0.25.0; python_version <= '3.13'",
    "aiodns~=3.6; sys_platform != 'win32'",
    "ciso8601~=2.3",
    "penguin-native",
]
web = ["aiohttp-remotes~=1.3"]

[dependency-groups]
dev = [
    "jishaku~=2.6",
    "ruff==0.13.3",
    "basedpyright==1.31.5",
    { include-group = "test" },
]
docs = [
    "mkdocs-material==9.6.21",
]
test = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24.0",
    "pytest-cov~=6.0",
    "pytest-httpx~=0.35.0",
    "pytest-html~=4.1",
]


[tool.uv]
managed = true
package = false
no-sources = false
# index-url = "https://mirrors.sustech.edu.cn/pypi/web/simple"

[tool.uv.pip]
universal = true
generate-hashes = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
discord-py = { git = "https://github.com/Rapptz/discord.py" }
discord-ext-songbird = { index = "discord-ext-songbird" }
penguin-native = { workspace = true }
httpx-aiohttp = { workspace = true }

[[tool.uv.index]]
name = "discord-ext-songbird"
url = "https://beer-psi.github.io/discord-ext-songbird"
explicit = true

[tool.ruff]
respect-gitignore = true

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "EM",
    "F",
    "FBT",
    "FLY",
    "I",
    "ISC",
    "Q",
    "PERF",
    "PGH",
    "PIE",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "TRY",
    "TID252",
    "W",
]
ignore = ["E501"]
unfixable = ["B"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"bot.py" = ["E402"]
"chunithm_net/consts.py" = ["RUF001"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
